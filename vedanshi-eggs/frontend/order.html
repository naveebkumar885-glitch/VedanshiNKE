<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Place Order - Vedanshi Natu Kodi Eggs</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link rel="stylesheet" href="order.css">
</head>
<body>
  <nav class="navbar navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="/"><i class="fas fa-egg"></i> Vedanshi</a>
      <a href="/" class="btn btn-outline-light"><i class="fas fa-arrow-left"></i> Back</a>
    </div>
  </nav>

  <div class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <div class="card shadow">
          <div class="card-header bg-warning">
            <h4><i class="fas fa-shopping-cart"></i> Place Your Order</h4>
          </div>
          <div class="card-body">
            <div class="card mb-4">
              <div class="card-body">
                <div class="row">
                  <div class="col-md-4">
                    <img id="productImage" src="" class="img-fluid rounded" style="height:150px;width:100%;object-fit:cover;">
                  </div>
                  <div class="col-md-8">
                    <h4 id="productName">Loading...</h4>
                    <p id="productDescription">Loading...</p>
                    <h5 class="text-warning">₹<span id="productPrice">0</span>/dozen</h5>
                  </div>
                </div>
              </div>
            </div>

            <form id="orderForm">
              <h5 class="mb-3">Customer Details</h5>
              <div class="mb-3">
                <input type="text" class="form-control" id="customerName" placeholder="Full Name" required>
              </div>
              <div class="mb-3">
                <input type="tel" class="form-control" id="customerPhone" placeholder="Phone Number" required>
              </div>
              <div class="mb-3">
                <input type="email" class="form-control" id="customerEmail" placeholder="Email (optional)">
              </div>

              <h5 class="mb-3">Delivery Address</h5>
              <div class="mb-3">
                <textarea class="form-control" id="deliveryAddress" rows="2" placeholder="Address" required></textarea>
              </div>
              <div class="row">
                <div class="col-md-6 mb-3">
                  <input type="text" class="form-control" id="deliveryCity" placeholder="City" required>
                </div>
                <div class="col-md-6 mb-3">
                  <input type="text" class="form-control" id="deliveryPincode" placeholder="Pincode" required>
                </div>
              </div>

              <h5 class="mb-3">Order Details</h5>
              <div class="mb-3">
                <label>Quantity (dozens)</label>
                <input type="number" class="form-control" id="quantity" value="1" min="1" oninput="calculateTotal()">
              </div>

              <div class="alert alert-success text-center">
                <h4>Total: ₹<span id="totalPrice">0</span></h4>
              </div>

              <button type="submit" class="btn btn-warning btn-lg w-100"><i class="fas fa-check-circle"></i> Place Order</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="config.js"></script>
  <script src="order.js"></script>
</body>
</html>
