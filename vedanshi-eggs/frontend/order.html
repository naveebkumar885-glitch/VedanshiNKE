<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Place Order - Vedanshi Natu Kodi Eggs</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link rel="stylesheet" href="order.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container">
      <a class="navbar-brand" href="/">
        <i class="fas fa-egg"></i> Vedanshi Natu Kodi Eggs
      </a>
      <div class="ms-auto">
        <a href="/" class="btn btn-outline-light">
          <i class="fas fa-arrow-left"></i> Back to Website
        </a>
      </div>
    </div>
  </nav>

  <div class="container mt-5 pt-5">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <div class="card shadow">
          <div class="card-header bg-warning text-dark">
            <h4 class="mb-0"><i class="fas fa-shopping-cart"></i> Place Your Order</h4>
          </div>
          <div class="card-body">
            <div class="card mb-4 border-warning">
              <div class="card-body">
                <div class="row align-items-center">
                  <div class="col-md-4 text-center">
                    <img id="productImage" src="" alt="Product Image" class="img-fluid rounded shadow" 
                         style="max-height: 200px; width: 100%; object-fit: cover; border-radius: 10px;">
                  </div>
                  <div class="col-md-8">
                    <h4 class="mb-2" id="productName">Loading...</h4>
                    <p class="text-muted mb-2" id="productDescription">Loading...</p>
                    <div class="alert alert-warning d-inline-block mb-0">
                      <strong>Price:</strong> <span id="productPrice" class="fs-4">₹0.00</span> <small>/ dozen</small>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <form id="orderForm">
              <h5 class="mb-3 text-primary"><i class="fas fa-user"></i> Customer Details</h5>
              <div class="mb-3">
                <label class="form-label">Full Name *</label>
                <input type="text" class="form-control" id="customerName" required placeholder="Enter your full name">
              </div>
              <div class="mb-3">
                <label class="form-label">Phone Number *</label>
                <input type="tel" class="form-control" id="customerPhone" required placeholder="Enter your phone number">
              </div>
              <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" id="customerEmail" placeholder="Enter your email (optional)">
              </div>

              <hr>

              <h5 class="mb-3 text-primary"><i class="fas fa-truck"></i> Delivery Information</h5>
              <div class="mb-3">
                <label class="form-label">Delivery Address *</label>
                <textarea class="form-control" id="deliveryAddress" rows="3" required placeholder="Enter your complete delivery address"></textarea>
              </div>
              <div class="row">
                <div class="col-md-6 mb-3">
                  <label class="form-label">City *</label>
                  <input type="text" class="form-control" id="deliveryCity" required placeholder="Enter your city">
                </div>
                <div class="col-md-6 mb-3">
                  <label class="form-label">Pincode *</label>
                  <input type="text" class="form-control" id="deliveryPincode" required placeholder="Enter pincode">
                </div>
              </div>

              <hr>

              <h5 class="mb-3 text-primary"><i class="fas fa-box"></i> Order Details</h5>
              <div class="mb-3">
                <label class="form-label">Quantity (in dozens) *</label>
                <input type="number" class="form-control" id="quantity" required min="1" max="100" value="1" 
                       oninput="calculateTotal()" style="font-size: 1.2rem; font-weight: 600;">
                <div class="form-text">Minimum 1 dozen, Maximum 100 dozens</div>
              </div>
              <div class="mb-3">
                <label class="form-label">Special Instructions</label>
                <textarea class="form-control" id="specialInstructions" rows="2" placeholder="Any special instructions (optional)"></textarea>
              </div>

              <div class="alert alert-success text-center">
                <h4 class="mb-0">
                  <i class="fas fa-calculator"></i> Total Amount: 
                  <span id="totalPrice" class="fw-bold text-success">₹0.00</span>
                </h4>
              </div>

              <div id="orderStatus"></div>
              
              <button type="submit" class="btn btn-warning btn-lg w-100" id="submitOrderBtn">
                <i class="fas fa-check-circle"></i> Place Order
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="order.js"></script>
</body>
</html>
