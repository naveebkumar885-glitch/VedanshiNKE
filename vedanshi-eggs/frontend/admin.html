<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - Vedanshi Natu Kodi Eggs</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container">
      <a class="navbar-brand" href="/"><i class="fas fa-shield-alt"></i> Admin Panel</a>
      <div class="ms-auto">
        <a href="/" class="btn btn-outline-light me-2"><i class="fas fa-home"></i> View Website</a>
        <button class="btn btn-outline-danger" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
      </div>
    </div>
  </nav>

  <!-- Login Modal -->
  <div class="modal fade" id="loginModal" tabindex="-1" data-bs-backdrop="static">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title"><i class="fas fa-lock"></i> Admin Login</h5>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label">Admin Password</label>
            <input type="password" class="form-control" id="adminPassword" placeholder="Enter admin password">
          </div>
          <div id="loginStatus"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-warning" id="loginBtn"><i class="fas fa-sign-in-alt"></i> Login</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Main Content -->
  <div class="container-fluid mt-5 pt-5">
    
    <!-- Order Summary Cards -->
    <div class="row mb-4">
      <div class="col-md-4">
        <div class="card shadow-sm border-start border-warning border-4">
          <div class="card-body">
            <div class="d-flex justify-content-between align-items-center">
              <div>
                <h6 class="text-muted mb-1">Pending Orders</h6>
                <h2 class="mb-0 text-warning" id="pendingCount">0</h2>
              </div>
              <i class="fas fa-clock fa-3x text-warning"></i>
            </div>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card shadow-sm border-start border-info border-4">
          <div class="card-body">
            <div class="d-flex justify-content-between align-items-center">
              <div>
                <h6 class="text-muted mb-1">Confirmed Orders</h6>
                <h2 class="mb-0 text-info" id="confirmedCount">0</h2>
              </div>
              <i class="fas fa-check-circle fa-3x text-info"></i>
            </div>
          </div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="card shadow-sm border-start border-success border-4">
          <div class="card-body">
            <div class="d-flex justify-content-between align-items-center">
              <div>
                <h6 class="text-muted mb-1">Delivered Orders</h6>
                <h2 class="mb-0 text-success" id="deliveredCount">0</h2>
              </div>
              <i class="fas fa-check-double fa-3x text-success"></i>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Add Product Section -->
    <div class="row mb-4">
      <div class="col-lg-6">
        <div class="card shadow">
          <div class="card-header bg-warning text-dark">
            <h4 class="mb-0"><i class="fas fa-plus-circle"></i> Add New Product</h4>
          </div>
          <div class="card-body">
            <form id="addProductForm">
              <div class="mb-3">
                <label class="form-label">Product Name *</label>
                <input type="text" class="form-control" id="productName" required>
              </div>
              <div class="mb-3">
                <label class="form-label">Description *</label>
                <textarea class="form-control" id="productDescription" rows="3" required></textarea>
              </div>
              <div class="mb-3">
                <label class="form-label">Price (₹) *</label>
                <input type="number" class="form-control" id="productPrice" required min="0" step="0.01">
              </div>
              
              <!-- Image Upload -->
              <div class="mb-3">
                <label class="form-label">Product Image *</label>
                <input type="file" class="form-control" id="productImageFile" accept="image/*">
                <div class="mt-2">
                  <img id="previewImg" src="" alt="Preview" style="max-height: 200px; display: none; border-radius: 10px; width: 100%; object-fit: cover;">
                </div>
              </div>
              
              <button type="submit" class="btn btn-warning w-100">
                <i class="fas fa-plus-circle"></i> Add Product
              </button>
            </form>
            <div id="addStatus" class="mt-3"></div>
          </div>
        </div>
      </div>

      <!-- Manage Products -->
      <div class="col-lg-6">
        <div class="card shadow">
          <div class="card-header bg-dark text-white">
            <h4 class="mb-0"><i class="fas fa-list"></i> Manage Products</h4>
          </div>
          <div class="card-body">
            <div class="table-responsive">
              <table class="table table-hover">
                <thead>
                  <tr>
                    <th>Image</th>
                    <th>Name</th>
                    <th>Price</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody id="productsTableBody"></tbody>
              </table>
            </div>
            <div id="productsStatus" class="mt-3"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Orders -->
    <div class="row mb-4">
      <div class="col-12">
        <ul class="nav nav-tabs" role="tablist">
          <li class="nav-item">
            <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#pendingOrders"><i class="fas fa-clock"></i> Pending</button>
          </li>
          <li class="nav-item">
            <button class="nav-link" data-bs-toggle="tab" data-bs-target="#confirmedOrders"><i class="fas fa-check-circle"></i> Confirmed</button>
          </li>
          <li class="nav-item">
            <button class="nav-link" data-bs-toggle="tab" data-bs-target="#deliveredOrders"><i class="fas fa-check-double"></i> Delivered</button>
          </li>
        </ul>
        <div class="tab-content mt-3">
          <div class="tab-pane fade show active" id="pendingOrders">
            <div class="card shadow">
              <div class="card-body">
                <div class="table-responsive">
                  <table class="table table-hover">
                    <thead>
                      <tr>
                        <th>Order #</th><th>Customer</th><th>Phone</th><th>Product</th><th>Qty</th><th>Total</th><th>Date</th><th>Actions</th>
                      </tr>
                    </thead>
                    <tbody id="pendingOrdersBody"></tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>
          <div class="tab-pane fade" id="confirmedOrders">
            <div class="card shadow">
              <div class="card-body">
                <div class="table-responsive">
                  <table class="table table-hover">
                    <thead>
                      <tr>
                        <th>Order #</th><th>Customer</th><th>Phone</th><th>Product</th><th>Qty</th><th>Total</th><th>Date</th><th>Actions</th>
                      </tr>
                    </thead>
                    <tbody id="confirmedOrdersBody"></tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>
          <div class="tab-pane fade" id="deliveredOrders">
            <div class="card shadow">
              <div class="card-body">
                <div class="table-responsive">
                  <table class="table table-hover">
                    <thead>
                      <tr>
                        <th>Order #</th><th>Customer</th><th>Phone</th><th>Product</th><th>Qty</th><th>Total</th><th>Date</th><th>Status</th>
                      </tr>
                    </thead>
                    <tbody id="deliveredOrdersBody"></tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="admin.js"></script>
</body>
</html>
