<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - Vedanshi Natu Kodi Eggs</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <nav class="navbar navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="/"><i class="fas fa-shield-alt"></i> Admin Panel</a>
      <a href="/" class="btn btn-outline-light"><i class="fas fa-home"></i> View Website</a>
    </div>
  </nav>

  <!-- Login Modal -->
  <div class="modal fade" id="loginModal" tabindex="-1" data-bs-backdrop="static">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header"><h5><i class="fas fa-lock"></i> Admin Login</h5></div>
        <div class="modal-body">
          <input type="password" class="form-control" id="adminPassword" placeholder="Enter password">
          <div id="loginStatus" class="mt-2"></div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-warning" id="loginBtn"><i class="fas fa-sign-in-alt"></i> Login</button>
        </div>
      </div>
    </div>
  </div>

  <div class="container-fluid mt-4">
    <!-- Product Form -->
    <div class="row">
      <div class="col-lg-6">
        <div class="card shadow">
          <div class="card-header bg-warning"><h4><i class="fas fa-plus-circle"></i> Add Product</h4></div>
          <div class="card-body">
            <form id="addProductForm">
              <div class="mb-3"><input type="text" class="form-control" id="productName" placeholder="Product Name" required></div>
              <div class="mb-3"><textarea class="form-control" id="productDescription" rows="2" placeholder="Description" required></textarea></div>
              <div class="mb-3"><input type="number" class="form-control" id="productPrice" placeholder="Price (₹)" required></div>
              <div class="mb-3">
                <input type="file" class="form-control" id="productImageFile" accept="image/*" required>
                <div class="mt-2"><img id="previewImg" style="max-height:150px;display:none;border-radius:10px;width:100%;object-fit:cover;"></div>
              </div>
              <button type="submit" class="btn btn-warning w-100"><i class="fas fa-plus"></i> Add</button>
            </form>
            <div id="addStatus" class="mt-2"></div>
          </div>
        </div>
      </div>

      <!-- Products List -->
      <div class="col-lg-6">
        <div class="card shadow">
          <div class="card-header bg-dark text-white"><h4><i class="fas fa-list"></i> Products</h4></div>
          <div class="card-body">
            <table class="table">
              <thead><tr><th>Image</th><th>Name</th><th>Price</th><th>Action</th></tr></thead>
              <tbody id="productsTableBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <!-- Orders -->
    <div class="row mt-4">
      <div class="col-12">
        <div class="card shadow">
          <div class="card-header bg-info text-white"><h4><i class="fas fa-shopping-cart"></i> Orders</h4></div>
          <div class="card-body">
            <ul class="nav nav-tabs">
              <li class="nav-item"><a class="nav-link active" data-bs-toggle="tab" href="#pending">Pending</a></li>
              <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#confirmed">Confirmed</a></li>
              <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#delivered">Delivered</a></li>
            </ul>
            <div class="tab-content mt-3">
              <div class="tab-pane fade show active" id="pending"><div class="table-responsive"><table class="table"><tbody id="pendingOrdersBody"></tbody></table></div></div>
              <div class="tab-pane fade" id="confirmed"><div class="table-responsive"><table class="table"><tbody id="confirmedOrdersBody"></tbody></table></div></div>
              <div class="tab-pane fade" id="delivered"><div class="table-responsive"><table class="table"><tbody id="deliveredOrdersBody"></tbody></table></div></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="config.js"></script>
  <script src="admin.js"></script>
</body>
</html>
